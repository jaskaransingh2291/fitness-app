name: Keep Supabase awake

on:
  schedule:
    - cron: '17 14 * * *'   # every day at about 10:17 am Toronto time
  workflow_dispatch:         # adds a "Run workflow" button for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Taakat's database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: sb_publishable_U191Gd_P-FAYsuZ5uq0b2A_ylvgiHdu" \
            "https://guhrftmudycxlzzygtir.supabase.co/rest/v1/profiles?select=id&limit=1")
          echo "Supabase answered: $code"
                   if [ "$code" != "200" ]; then
            echo "Expected 200 - Supabase may be paused, or the key or rules changed."
            exit 1
          fi
